name: eaglehr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eaglehr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eaglehr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eaglehr}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - eaglehr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eaglehr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  eaglehr_pgdata:
